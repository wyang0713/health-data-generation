services:
  postgres:
    image: postgres:17
    container_name: pg17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  python:
    build: ./python
    container_name: pyetl
    depends_on:
      postgres:
        condition: service_healthy    # wait until the DB accepts connections
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./python:/app
      - ../etl_pipeline/patient_data:/app/data
      - ../etl_pipeline/health_data:/app/health_data
      - ./logs:/app/logs
    command: python run_pipeline.py

volumes:
  pgdata: